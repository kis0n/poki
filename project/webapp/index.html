<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toki Mini App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Flatpickr CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_blue.css">
</head>
<body>
    <div class="container">
        <!-- Блок выбора пользователя для разработки -->
        <div id="dev-user-selector" style="display: none; padding: 8px; background: #f0f0f0; border-radius: 8px; margin-bottom: 10px; text-align: center;">
            <label for="user-id-input" style="font-size: 0.9rem; color: #666; margin-right: 8px;">User ID:</label>
            <input type="number" id="user-id-input" placeholder="Введите user_id" style="padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; width: 100px;">
            <button id="apply-user-btn" style="margin-left: 8px; padding: 4px 12px; background: #ff8200; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem;">Применить</button>
        </div>
        <header>
            <div class="calendar-controls">
              <select id="year-select"></select>
            </div>
            <div id="calendar"></div>
        </header>
        <main>
            <h2 id="selected-date"></h2>
            <ul id="reminders-list">
                <li class="no-reminders">Нет напоминаний</li>
            </ul>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <!-- yearSelect plugin for flatpickr -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/yearSelect/yearSelect.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/yearSelect/yearSelect.css">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="telegram.js"></script>
    <script src="script.js"></script>
</body>
</html>
